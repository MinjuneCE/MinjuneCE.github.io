<style>/* ============ TOKENS ============ */
:root {
  --bg: #ededea;
  --bg-alt: #e3e3df;
  --paper: #f6f5f2;
  --ink: #111;
  --ink-2: #2a2a2a;
  --mute: #6a6a6a;
  --rule: rgba(0,0,0,0.12);
  --rule-strong: rgba(0,0,0,0.6);
  --accent: #d94f1f;
  --accent-soft: #f5dccf;
  --ok: #2a8f4f;

  --sans: 'Inter', 'Helvetica Neue', Helvetica, system-ui, sans-serif;
  --display: 'Inter', 'Helvetica Neue', Helvetica, system-ui, sans-serif;
  --mono: 'Geist Mono', 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;

  --pad-x: clamp(20px, 5vw, 64px);
  --max: 1440px;
  --nav-h: 58px;
  --pager-h: 64px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body { overflow: hidden; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

::selection { background: var(--accent); color: #fff; }

/* ============ NAV ============ */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  height: var(--nav-h); padding: 0 var(--pad-x);
  background: rgba(237,237,234,0.78);
  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 12px; letter-spacing: -0.005em;
}
.nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--ink); }
.nav-brand .mark {
  width: 22px; height: 22px; border-radius: 50%; background: var(--ink);
  position: relative; display: inline-block;
}
.nav-brand .mark::after {
  content: ''; position: absolute; inset: 4px;
  border-radius: 50%; background: var(--accent);
  transform-origin: center; animation: orbit 8s linear infinite;
}
@keyframes orbit {
  0% { transform: translate(0,0); }
  25% { transform: translate(2px, -2px); }
  50% { transform: translate(0, 0); }
  75% { transform: translate(-2px, 2px); }
  100% { transform: translate(0,0); }
}
.nav-brand .sep { color: var(--mute); margin: 0 2px; }
.nav-brand .role { color: var(--mute); font-weight: 400; }
.nav-links { display: flex; gap: 6px; align-items: center; }
.nav-links a {
  padding: 8px 12px; border-radius: 999px; transition: all .2s ease;
  color: var(--mute); position: relative;
}
.nav-links a:hover { color: var(--ink); }
.nav-links a.active { color: var(--ink); background: rgba(17,17,17,0.06); }
.nav-links a.active::before {
  content: ''; position: absolute; left: 12px; right: 12px; bottom: 4px;
  height: 1px; background: var(--accent);
}
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-time { color: var(--mute); }
.nav-cta {
  padding: 8px 14px; border: 1px solid var(--ink); border-radius: 999px;
  color: var(--ink); transition: all .2s ease;
}
.nav-cta:hover { background: var(--ink); color: var(--bg); }
/* 10개 링크 + 긴 role: 폭이 모자라면 시계 → role → 링크 여백 순으로 줄임 */
.nav-brand, .nav-links a, .nav-right { white-space: nowrap; }
@media (max-width: 1560px) { .nav-time { display: none; } }
@media (max-width: 1360px) {
  .nav-brand .sep, .nav-brand .role { display: none; }
  .nav-links { gap: 2px; }
  .nav-links a { padding: 8px 9px; }
  .nav-links a.active::before { left: 9px; right: 9px; }
}
@media (max-width: 1180px) {
  .nav-links a { padding: 8px 6px; font-size: 11px; }
  .nav-links a.active::before { left: 6px; right: 6px; }
}

.scroll-progress {
  position: fixed; top: 0; left: 0; height: 2px;
  background: var(--accent); z-index: 200; width: 0%; transition: width .45s cubic-bezier(.2,.7,.2,1);
}

/* ============ PAGE VIEWPORT ============ */
.page-viewport {
  position: fixed;
  top: var(--nav-h); bottom: var(--pager-h); left: 0; right: 0;
  overflow: hidden;
  background: var(--bg);
}
.page-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  animation: pageIn .5s cubic-bezier(.2,.7,.2,1);
  outline: none;
  display: flex;
  flex-direction: column;
}
.page-scroll--dark { background: var(--ink); }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
.page-scroll > section { flex: 1 0 auto; }

/* ============ PAGER ============ */
.pager {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
  height: var(--pager-h);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 var(--pad-x);
  background: rgba(237,237,234,0.85);
  backdrop-filter: saturate(140%) blur(14px);
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
}
.pager-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 18px; border: 1px solid var(--ink); background: transparent;
  color: var(--ink); font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.02em; border-radius: 999px; transition: all .2s ease;
}
.pager-btn:hover:not(:disabled) { background: var(--ink); color: var(--bg); }
.pager-btn:disabled { opacity: 0.3; cursor: default; border-color: var(--mute); color: var(--mute); }
.pager-btn .arr { transition: transform .2s ease; display: inline-block; }
.pager-btn.next:hover:not(:disabled) .arr { transform: translateX(3px); }
.pager-btn.prev:hover:not(:disabled) .arr { transform: translateX(-3px); }
.pager-center { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.pager-ticks { display: flex; gap: 4px; }
.pager-tick {
  font-family: var(--mono); font-size: 10px; color: var(--mute);
  background: transparent; border: none; padding: 8px 6px 10px; min-width: 32px;
  position: relative; transition: color .2s ease; letter-spacing: 0.02em;
}
.pager-tick:hover { color: var(--ink); }
.pager-tick.on { color: var(--ink); font-weight: 600; }
.pager-tick.on::after {
  content: ''; position: absolute; left: 6px; right: 6px; bottom: 6px;
  height: 2px; background: var(--accent);
}
.pager-info { font-size: 10.5px; color: var(--mute); letter-spacing: 0.06em; text-transform: uppercase; }
.pager-info b { color: var(--ink); font-weight: 600; }

/* ============ SCROLL HINT ============ */
.scroll-hint {
  position: fixed; left: 50%; bottom: calc(var(--pager-h) + 16px); z-index: 90;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border: 1px solid var(--rule-strong); border-radius: 999px;
  background: rgba(246,245,242,0.92);
  backdrop-filter: saturate(140%) blur(8px);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink);
  opacity: 0; transform: translate(-50%, 8px); pointer-events: none;
  transition: opacity .35s ease, transform .35s ease;
}
.scroll-hint.show { opacity: 1; transform: translate(-50%, 0); }
.scroll-hint .sh-arr { color: var(--accent); display: inline-block; animation: hintBob 1.6s ease-in-out infinite; }
@keyframes hintBob {
  0%, 100% { transform: translateY(-1px); }
  50% { transform: translateY(3px); }
}

/* ============ COMMON ============ */
/* 세로 여백은 화면 높이에 따라 줄어든다(낮은 화면에서 불필요한 스크롤 방지) */
section {
  position: relative;
  padding: clamp(32px, 6vh, 64px) var(--pad-x) clamp(36px, 7.5vh, 80px);
}
.container { max-width: var(--max); margin: 0 auto; width: 100%; }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }

.section-header {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 18px; border-bottom: 1px solid var(--rule-strong);
  margin-bottom: clamp(24px, 5.2vh, 56px);
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
  color: var(--mute);
}
.section-header .left { color: var(--ink); font-weight: 500; }
.section-header .right { display: flex; gap: 24px; }
.section-header .right span { display: inline-flex; gap: 6px; }
.section-header .right b { color: var(--ink); font-weight: 500; }

.reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: none; }
.reveal.d1 { transition-delay: 0.08s; }
.reveal.d2 { transition-delay: 0.16s; }
.reveal.d3 { transition-delay: 0.24s; }
.reveal.d4 { transition-delay: 0.32s; }

/* ============ HERO ============ */
.hero { padding-top: 24px; padding-bottom: 28px; min-height: 100%; display: flex; align-items: center; }
.hero-content { width: 100%; }

.hero-top {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
  padding-bottom: 22px; border-bottom: 1px solid var(--ink);
  font-family: var(--mono); font-size: 12px;
}
.hero-top > div:nth-child(1) { grid-column: span 4; font-weight: 500; }
.hero-top > div:nth-child(2) { grid-column: span 4; color: var(--mute); }
.hero-top > div:nth-child(3) { grid-column: span 4; text-align: right; color: var(--mute); }

.hero-main { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; margin-top: 32px; }
.hero-num { grid-column: span 2; font-family: var(--mono); font-size: 12px; color: var(--mute); }
.hero-num a { display: block; padding: 4px 0; border-bottom: 1px solid var(--rule); transition: color .2s ease; }
.hero-num a:hover { color: var(--ink); }
.hero-num a.cur { color: var(--ink); font-weight: 500; }
.hero-num a.cur::before { content: '→ '; color: var(--accent); }
.hero-num a .hook { display: block; color: var(--accent); font-size: 10px; letter-spacing: 0.02em; padding: 2px 0 5px; }

.hero-headline-wrap { grid-column: span 10; }
.hero-headline {
  font-size: clamp(54px, 10vw, 138px);
  font-weight: 500; line-height: 0.88; letter-spacing: -0.055em;
  margin: 0; color: var(--ink);
}
.hero-headline .line { display: block; overflow: hidden; padding-bottom: 0.06em; }
.hero-headline .line > span {
  display: inline-block;
  transform: translateY(110%);
  animation: lineRise 1.1s cubic-bezier(.2,.7,.2,1) forwards;
}
.hero-headline .line:nth-child(1) > span { animation-delay: 0.1s; }
.hero-headline .line:nth-child(2) > span { animation-delay: 0.22s; }
.hero-headline .line:nth-child(3) > span { animation-delay: 0.4s; }
.hero-headline .accent { color: var(--accent); font-style: italic; font-weight: 400; }
.hero-headline .sub {
  font-size: 0.16em; font-weight: 400; color: var(--mute);
  letter-spacing: -0.01em; display: inline-block; margin-top: 0.7em;
  font-family: var(--mono); letter-spacing: 0;
}
@keyframes lineRise { to { transform: translateY(0); } }

.hero-mid {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
  margin-top: 38px; padding-top: 20px; border-top: 1px solid var(--rule);
}
.hero-role { grid-column: span 5; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
.hero-role .label { color: var(--mute); margin-right: 12px; font-weight: 400; }
.hero-role b { font-weight: 500; }
.hero-slogan { grid-column: span 5; font-size: 17px; line-height: 1.55; color: #333; max-width: 520px; }
.hero-slogan .case-hint {
  display: block; width: fit-content; margin-top: 12px;
  font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.02em;
  color: var(--accent); border-bottom: 1px solid var(--accent-soft);
  padding-bottom: 2px; transition: border-color .2s ease;
}
.hero-slogan .case-hint:hover { border-color: var(--accent); }
.hero-status {
  grid-column: span 2; display: flex; align-items: center; gap: 10px;
  justify-content: flex-end; font-size: 12px; font-family: var(--mono);
}
.hero-status .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
  box-shadow: 0 0 0 4px rgba(42,143,79,0.15);
  animation: pulseDot 2.4s ease-in-out infinite;
}
@keyframes pulseDot {
  0%, 100% { box-shadow: 0 0 0 4px rgba(42,143,79,0.15); }
  50% { box-shadow: 0 0 0 8px rgba(42,143,79,0.03); }
}

.hero-bottom { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; margin-top: 34px; align-items: end; }
.hero-ctas { grid-column: span 6; display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  font-family: var(--sans); font-size: 14px; padding: 18px 28px;
  cursor: pointer; transition: all .25s ease; letter-spacing: -0.01em;
  text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
  border-radius: 0; font-weight: 500; border: 1px solid var(--ink);
}
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--bg); }
.btn .arr { transition: transform .25s ease; display: inline-block; }
.btn:hover .arr { transform: translateX(4px); }

.hero-counters {
  grid-column: span 6;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
  font-family: var(--mono); font-size: 11px; color: var(--mute);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.hero-counters > div { border-top: 1px solid var(--ink); padding-top: 12px; }
.hero-counters b {
  display: block; font-family: var(--sans); font-size: 32px;
  font-weight: 600; color: var(--ink); letter-spacing: -0.03em;
  margin-bottom: 4px; text-transform: none;
}

/* ============ ABOUT ============ */
.about { background: var(--bg); }
.about-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
.about-headline { grid-column: span 12; margin-bottom: clamp(24px, 5.2vh, 56px); }
.about-headline h2 {
  font-size: clamp(48px, 8vw, 132px);
  font-weight: 500; line-height: 0.92; letter-spacing: -0.045em;
  margin: 0;
}
.about-headline h2 .ink-em { color: var(--accent); font-style: italic; font-weight: 400; }

.about-cols { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
.about-prose { grid-column: span 7; }
.about-prose p {
  font-size: 17px; line-height: 1.65; color: #222; margin: 0 0 22px;
  max-width: 640px; text-wrap: pretty;
}
.about-prose p:first-child { font-size: 19px; color: #111; }
.about-prose .kw { color: var(--accent); font-style: italic; }
.about-prose strong { font-weight: 600; color: var(--ink); }

.about-terminal { grid-column: span 5; }
.terminal {
  background: #0e0e0e; color: #d4d4d4;
  border-radius: 6px; overflow: hidden;
  font-family: var(--mono); font-size: 13px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.04) inset;
}
.terminal-bar {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid #1c1c1c; background: #161616;
  font-size: 11px; color: #777;
}
.terminal-bar .dots { display: flex; gap: 6px; }
.terminal-bar .dots span { width: 11px; height: 11px; border-radius: 50%; display: block; }
.terminal-body { padding: 22px 22px 26px; min-height: 280px; }
.terminal-line { padding: 3px 0; }
.terminal-line .prompt { color: #d94f1f; margin-right: 8px; }
.terminal-line .out { color: #b8b8b8; }
.terminal-line .green { color: #6fbf73; }
.terminal-line .blue { color: #7aa7e6; }
.terminal-line .gray { color: #707070; }
.terminal-cursor { display: inline-block; width: 8px; height: 1em; background: #d94f1f; vertical-align: -2px; margin-left: 4px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.about-stats {
  grid-column: span 12; margin-top: clamp(28px, 6vh, 64px);
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  border-top: 1px solid var(--ink);
}
.about-stat { padding: clamp(16px, 2.6vh, 28px) 24px clamp(14px, 2.3vh, 24px); border-right: 1px solid var(--rule); position: relative; }
.about-stat:last-child { border-right: none; }
.about-stat .n {
  font-size: clamp(36px, 4.5vw, 64px); font-weight: 500;
  letter-spacing: -0.04em; line-height: 1; color: var(--ink); margin: 0 0 12px;
}
.about-stat .l {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--mute);
}
.about-stat.featured .n { color: var(--accent); }

/* ============ EXPERIENCE ============ */
.experience { background: var(--bg-alt); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.exp-company {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
  padding-bottom: 56px; border-bottom: 1px solid var(--rule-strong); margin-bottom: 64px;
}
.exp-company-meta { grid-column: span 4; }
.exp-company-meta .period {
  font-family: var(--mono); font-size: 13px; color: var(--mute);
  border-left: 2px solid var(--accent); padding-left: 12px;
}
.exp-company-meta h3 {
  font-size: clamp(28px, 3.5vw, 44px); font-weight: 500;
  letter-spacing: -0.025em; margin: 18px 0 8px; line-height: 1.05;
}
.exp-company-meta .rel { font-family: var(--mono); font-size: 11.5px; color: var(--mute); margin: 0 0 10px; letter-spacing: 0.02em; }
.exp-company-meta .role-line {
  font-family: var(--mono); font-size: 12px; color: var(--mute); letter-spacing: 0.04em;
}
.exp-company-meta .role-line b { color: var(--ink); font-weight: 500; }
.exp-company-meta .role-line .promo {
  display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px;
  background: var(--accent); color: #fff; font-size: 10px; letter-spacing: 0.05em;
}
.exp-company-desc { grid-column: 6 / -1; font-size: 16px; line-height: 1.65; color: #333; max-width: 700px; }
.exp-company-desc p { margin: 0 0 14px; }

.exp-section-label {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--mute); margin-bottom: 24px;
  display: flex; align-items: center; gap: 12px;
}
.exp-section-label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.exp-section-label .count { color: var(--ink); font-weight: 500; }

.starred-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 64px; }
.starred {
  display: grid; grid-template-columns: 80px 1fr; gap: 0;
  background: var(--paper); border: 1px solid var(--rule);
  transition: all .3s cubic-bezier(.2,.7,.2,1); position: relative; overflow: hidden;
}
.starred:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 16px 40px -16px rgba(0,0,0,0.18); }
.starred:hover .star { color: var(--ink); }
.starred:hover .star::before { transform: scaleY(1); }
.starred .star {
  position: relative;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 28px 0 0; font-size: 22px; color: var(--mute);
  border-right: 1px solid var(--rule);
  transition: color .3s ease;
}
.starred .star::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px; background: var(--accent);
  transform: scaleY(0); transform-origin: top;
  transition: transform .5s cubic-bezier(.2,.7,.2,1);
}
.starred .body { padding: 24px 28px 26px; }
.starred .head {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline;
  margin-bottom: 14px;
}
.starred .head .num {
  font-family: var(--mono); font-size: 12px; color: var(--mute); font-weight: 500;
}
.starred .head h4 {
  font-size: clamp(18px, 1.7vw, 22px); font-weight: 500;
  letter-spacing: -0.015em; margin: 0; line-height: 1.25; flex: 1; min-width: 280px;
}
.starred .head .period {
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  padding: 3px 10px; background: var(--bg); border: 1px solid var(--rule);
}
.starred .head .status {
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  padding: 3px 10px; background: var(--accent-soft); letter-spacing: 0.04em;
}
.starred .role-tag {
  font-family: var(--mono); font-size: 12px; color: var(--mute);
  margin-bottom: 14px; letter-spacing: -0.005em;
}
.starred .role-tag b { color: var(--ink); font-weight: 500; }
.starred ul {
  list-style: none; padding: 0; margin: 0 0 16px;
  display: flex; flex-direction: column; gap: 6px;
}
.starred ul li {
  font-size: 14.5px; line-height: 1.55; color: #2a2a2a;
  padding-left: 18px; position: relative;
}
.starred ul li::before {
  content: ''; position: absolute; left: 0; top: 0.62em;
  width: 8px; height: 1px; background: var(--ink);
}
.starred ul li code {
  font-family: var(--mono); font-size: 0.9em; color: var(--accent);
  background: transparent; padding: 0 2px;
}
.starred .stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--rule); }
.tag {
  font-family: var(--mono); font-size: 11px; padding: 4px 10px;
  background: var(--bg); border: 1px solid var(--rule); color: #333;
  letter-spacing: -0.005em; transition: all .2s ease;
}
.tag:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.minor-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 56px; }
.minor {
  padding: 20px 22px; background: var(--paper); border: 1px solid var(--rule);
  transition: all .25s ease;
}
.minor:hover { border-color: var(--ink); }
.minor .head {
  display: flex; justify-content: space-between; gap: 12px;
  align-items: baseline; margin-bottom: 6px;
}
.minor .head .num { font-family: var(--mono); font-size: 11px; color: var(--mute); }
.minor .head .period { font-family: var(--mono); font-size: 11px; color: var(--mute); }
.minor h4 {
  font-size: 16px; font-weight: 500; letter-spacing: -0.012em;
  margin: 0 0 10px; line-height: 1.3;
}
.minor p { font-size: 14px; line-height: 1.55; color: #333; margin: 0 0 12px; }
.minor .stack { display: flex; flex-wrap: wrap; gap: 4px; }
.minor .stack .tag { padding: 2px 8px; font-size: 10.5px; }

.exp-extra {
  margin-top: 24px; padding: 28px;
  background: var(--bg); border: 1px solid var(--rule);
  display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center;
}
.exp-extra .label {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--mute);
}
.exp-extra ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.exp-extra ul li { font-family: var(--mono); font-size: 13px; color: var(--ink); }
.exp-extra ul li .yr { color: var(--mute); margin-left: 10px; }

/* ============ PROJECTS ============ */
.projects { background: var(--bg); }
.proj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.proj-card {
  background: var(--paper); border: 1px solid var(--rule); padding: 32px;
  display: flex; flex-direction: column;
  transition: all .3s cubic-bezier(.2,.7,.2,1);
  position: relative; overflow: hidden;
}
.proj-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
  background: var(--accent); transform: scaleX(0); transform-origin: left;
  transition: transform .5s cubic-bezier(.2,.7,.2,1);
}
.proj-card:hover { border-color: var(--ink); transform: translateY(-3px); box-shadow: 0 24px 50px -20px rgba(0,0,0,0.15); }
.proj-card:hover::before { transform: scaleX(1); }
.proj-card .cat {
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
  display: flex; justify-content: space-between;
}
.proj-card .cat .pno { color: var(--mute); font-weight: 400; }
.proj-card h3 {
  font-size: clamp(22px, 2.2vw, 30px); font-weight: 500;
  letter-spacing: -0.022em; line-height: 1.2; margin: 18px 0 28px;
}
.proj-card h3 .biz { color: var(--mute); font-weight: 400; }
.proj-block { margin-bottom: 18px; }
.proj-block .blabel {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--mute); margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.proj-block .blabel::before { content: ''; width: 16px; height: 1px; background: var(--accent); }
.proj-block p { font-size: 14.5px; line-height: 1.6; color: #2a2a2a; margin: 0; }
.proj-block ul { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-direction: column; gap: 4px; }
.proj-block ul li { font-size: 14px; line-height: 1.55; color: #2a2a2a; padding-left: 14px; position: relative; }
.proj-block ul li::before { content: '·'; position: absolute; left: 4px; top: 0; color: var(--accent); font-weight: 700; }
.proj-block code { font-family: var(--mono); color: var(--accent); font-size: 0.92em; }
.proj-block.alt { padding: 14px 16px; margin-bottom: 18px; background: rgba(17,17,17,0.025); border-left: 2px solid var(--accent); }
.proj-block.alt .blabel { margin-bottom: 8px; }
.proj-block.alt ul li { font-size: 13.5px; }
.proj-more { margin: -4px 0 18px; }
.proj-more a {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.02em;
  color: var(--accent); border-bottom: 1px solid var(--accent-soft);
  padding-bottom: 2px; transition: border-color .2s ease;
}
.proj-more a:hover { border-bottom-color: var(--accent); }
.proj-more .arr { transition: transform .2s ease; }
.proj-more a:hover .arr { transform: translateX(3px); }
.proj-card .stack { margin-top: auto; padding-top: 20px; border-top: 1px dashed var(--rule); display: flex; flex-wrap: wrap; gap: 6px; }

/* ============ CASE STUDY ============ */
.case { background: var(--bg-alt); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.case-intro { margin-bottom: 52px; }
.case-cat { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }
.case-intro h3 { font-size: clamp(28px, 4vw, 52px); font-weight: 500; letter-spacing: -0.035em; line-height: 1.08; margin: 16px 0 20px; }
.case-lead { font-size: 17px; line-height: 1.62; color: #333; }
.case-lead strong { font-weight: 600; color: var(--ink); }
.case-meta { display: flex; flex-wrap: wrap; gap: 14px 40px; margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; }
.case-meta > div { display: flex; flex-direction: column; gap: 5px; }
.case-meta .k { color: var(--mute); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
.case-meta .v { color: var(--ink); }

.case-section-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); margin: 0 0 22px; display: flex; align-items: center; gap: 12px; }
.case-section-label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

.case-trace { display: flex; flex-direction: column; margin-bottom: 56px; }
.case-beat { display: grid; grid-template-columns: 60px 1fr; gap: 20px; padding: 22px 0; border-top: 1px solid var(--rule); }
.case-beat:last-child { border-bottom: 1px solid var(--rule); }
.case-beat .bn { font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 500; padding-top: 2px; }
.case-beat .bbody h4 { font-size: 16px; font-weight: 600; letter-spacing: -0.012em; margin: 0 0 8px; color: var(--ink); }
.case-beat .bbody p { font-size: 14.5px; line-height: 1.62; color: #2a2a2a; margin: 0; }
.case-beat .bbody p + p { margin-top: 8px; }
.case-beat .bbody code { font-family: var(--mono); color: var(--accent); font-size: 0.9em; }
.case-beat .bbody strong { font-weight: 600; color: var(--ink); }

/* AI Harness : Case Study 골격을 재사용하고 축·트레이드오프 블록만 추가 */
.harness-axes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 56px; }
/* 2 · 4개 축은 2열로 (3열이면 한 장이 홀로 떨어짐) */
.harness-axes.n2, .harness-axes.n4 { grid-template-columns: repeat(2, 1fr); }
.harness-axis {
  border: 1px solid var(--rule); border-radius: 8px; padding: 22px 22px 18px;
  display: flex; flex-direction: column; background: rgba(255,255,255,0.4);
}
.hx-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.hx-name { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink); }
.hx-no { font-family: var(--mono); font-size: 11px; color: var(--mute); }
.harness-axis h4 { font-size: 15px; font-weight: 600; letter-spacing: -0.012em; margin: 0 0 14px; color: var(--ink); line-height: 1.45; }
.hx-label {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--mute); margin: 0 0 6px; padding-top: 10px; border-top: 1px dashed var(--rule);
}
.harness-axis ul { margin: 0 0 4px; padding-left: 16px; }
.harness-axis li { font-size: 13.5px; line-height: 1.55; color: #2a2a2a; margin-bottom: 6px; }
.hx-edge { font-size: 13.5px; line-height: 1.55; color: #2a2a2a; margin: 0 0 4px; }
.harness-axis code { font-family: var(--mono); color: var(--accent); font-size: 0.9em; }
.harness-axis strong { font-weight: 600; color: var(--ink); }
.hx-stack {
  margin-top: auto; padding-top: 16px; border-top: 1px dashed var(--rule);
  display: flex; flex-wrap: wrap; gap: 6px;
}
.hx-stack .tag { padding: 3px 9px; font-size: 10.5px; }

.harness-trades { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 32px; }
.harness-trade { padding: 18px 0; border-top: 1px solid var(--rule); }
.ht-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
.ht-n { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 500; }
.ht-t { font-size: 15px; font-weight: 600; letter-spacing: -0.012em; color: var(--ink); line-height: 1.4; }
.harness-trade p { font-size: 13.5px; line-height: 1.6; color: #2a2a2a; margin: 0 0 6px; }
.ht-k {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em;
  padding: 1px 6px; border-radius: 3px; margin-right: 6px; white-space: nowrap;
}
.ht-k.got { color: var(--accent); background: var(--accent-soft); }
.ht-k.gave { color: var(--mute); background: rgba(17,17,17,0.06); }
.harness-trade strong { font-weight: 600; color: var(--ink); }

@media (max-width: 900px) {
  .harness-axes, .harness-axes.n2, .harness-axes.n4 { grid-template-columns: 1fr; }
  .harness-trades { grid-template-columns: 1fr; }
}

.case-diagram { background: #0e0e0e; border-radius: 8px; padding: 26px; margin-bottom: 14px; overflow-x: auto; box-shadow: 0 28px 56px -28px rgba(0,0,0,0.35); }
.case-diagram svg { width: 100%; height: auto; min-width: 640px; display: block; }
.case-fig { font-family: var(--mono); font-size: 11.5px; color: var(--mute); margin: 0 0 56px; line-height: 1.5; }
.hx-fig { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 32px 26px; margin-bottom: 14px; overflow-x: auto; }
.hx-fig svg { width: 100%; max-width: 1104px; margin: 0 auto; height: auto; min-width: 620px; display: block; }
.harness .hx-fig + .case-fig { margin-bottom: 34px; }
/* 가로판 · 세로판을 둘 다 가진 그림: 600px 이하에서 세로판으로 바꿈 */
.hx-fig svg.hx-narrow { display: none; }
@media (max-width: 600px) {
  .hx-fig:has(svg.hx-narrow) { padding: 18px 12px; overflow-x: visible; }
  .hx-fig svg.hx-wide { display: none; }
  .hx-fig svg.hx-narrow { display: block; min-width: 0; max-width: 420px; }
}
.case-fig code { color: var(--accent); }

.case-code { background: #0e0e0e; border-radius: 8px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 28px 56px -28px rgba(0,0,0,0.35); }
.case-code .cbar { display: flex; align-items: center; padding: 10px 18px; background: #161616; border-bottom: 1px solid #1c1c1c; font-family: var(--mono); font-size: 11px; color: #8a8a8a; letter-spacing: 0.02em; }
.case-code pre { margin: 0; padding: 20px 22px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: #d4d4d4; tab-size: 4; white-space: pre; }
.case-note-inline { font-family: var(--mono); font-size: 11px; color: var(--mute); margin: 2px 0 56px; }
.harness-project.sep { margin-top: 76px; padding-top: 60px; border-top: 2px solid var(--ink); }
.hx-page-lead { margin: 0 0 56px; padding-bottom: 28px; border-bottom: 1px solid var(--rule); }

/* 06 AI 기술 타임라인: 왼쪽 레일에 월 마커, 오른쪽에 기술 카드 그리드 */
.tl-intro { margin-bottom: 40px; }
.tl-layers { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; margin: 0 0 28px; font-size: 12.5px; color: var(--mute); }
.tl-layer-def { display: flex; align-items: baseline; gap: 8px; }
.tl-where-key { display: flex; align-items: center; gap: 5px; margin-left: auto; }
.tl-where-key > span:last-child { margin-left: 4px; font-family: var(--mono); font-size: 10.5px; }
.tl-layer {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; white-space: nowrap;
  color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px;
}
.tl { list-style: none; margin: 0 0 40px; padding: 0; }
.tl-month { display: grid; grid-template-columns: 128px 1fr; gap: 20px; position: relative; padding-bottom: 26px; }
.tl-month::before { content: ''; position: absolute; left: 5px; top: 17px; bottom: 0; width: 1px; background: var(--rule-strong); opacity: 0.45; }
.tl-month:last-child::before { display: none; }
.tl-mark { display: flex; align-items: center; gap: 10px; height: 24px; }
.tl-dot { flex: none; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg-alt); position: relative; z-index: 1; }
.tl-m { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--ink); }
.tl-cnt { font-family: var(--mono); font-size: 10.5px; color: var(--mute); }
.tl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-auto-flow: row dense; gap: 12px; position: relative; }
.tl-card { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px 12px; background: rgba(255,255,255,0.45); }
.tl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tl-card h4 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; color: var(--ink); }
.tl-what { margin: 0; font-size: 13px; line-height: 1.5; color: #2a2a2a; }
.tl-how { margin: 0; font-size: 12.5px; line-height: 1.5; color: #4a4a4a; }
.tl-how .k { font-family: var(--mono); font-size: 10.5px; color: var(--mute); margin-right: 6px; }
.tl-card code, .tl-principles code { font-family: var(--mono); color: var(--accent); font-size: 0.9em; }
.tl-card strong, .tl-principles strong { font-weight: 600; color: var(--ink); }
.tl-where { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 6px; }
.tl-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.02em; padding: 1px 7px; border-radius: 3px; background: rgba(17,17,17,0.07); color: var(--ink); }
.tl-tag.co { background: var(--accent); color: #fff; }
.tl-tag.tr { background: var(--accent-soft); color: var(--accent); }
.tl-tag.kv { background: rgba(17,17,17,0.07); color: var(--ink); }
/* 카드 상세: 제목 버튼의 ::after가 카드 전체를 덮어 어디를 눌러도 펼침 */
.tl-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin: 0 0 28px; padding-top: 14px; border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 11px; color: var(--mute); }
.tl-all { font: inherit; color: var(--ink); background: none; border: 1px solid var(--rule-strong); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.tl-all:hover, .tl-all[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.tl-card.has-detail { position: relative; transition: border-color .15s, background-color .15s; }
.tl-card.has-detail:hover { border-color: rgba(0,0,0,0.3); }
.tl-card[data-open] { border-color: var(--accent); background: var(--paper); }
.tl-toggle { font: inherit; color: inherit; letter-spacing: inherit; text-align: left; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
.tl-toggle::after { content: ''; position: absolute; inset: 0; border-radius: 8px; }
.tl-toggle:focus { outline: none; }
.tl-toggle:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.tl-more { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--mute); white-space: nowrap; }
.tl-card.has-detail:hover .tl-more, .tl-card[data-open] .tl-more { color: var(--accent); }
.tl-detail {
  grid-column: 1 / -1; position: relative; border: 1px solid var(--accent); border-radius: 8px; background: var(--paper);
  padding: 18px 22px 16px; animation: tl-open .22s ease-out; word-break: keep-all; overflow-wrap: anywhere;
}
.tl-detail::before {
  content: ''; position: absolute; top: -7px; left: calc(var(--caret-x, 48px) - 6px); width: 12px; height: 12px;
  background: var(--paper); border-left: 1px solid var(--accent); border-top: 1px solid var(--accent); transform: rotate(45deg);
}
@keyframes tl-open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.tl-d-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.tl-d-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.45fr); gap: 14px 30px; }
.tl-d-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; color: var(--mute); margin-bottom: 6px; }
.tl-d-col p { margin: 0; font-size: 13.5px; line-height: 1.62; color: #2a2a2a; }
.tl-d-cases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.tl-d-cases li { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: baseline; font-size: 13.5px; line-height: 1.55; color: #2a2a2a; }
.tl-d-cases .tl-tag { justify-self: start; }
.tl-d-note { display: flex; gap: 10px; align-items: baseline; margin: 14px 0 0; padding-top: 10px; border-top: 1px dashed var(--rule); font-size: 12.5px; line-height: 1.55; color: var(--mute); }
.tl-d-note .tl-d-k { margin: 0; flex: none; }
.tl-d-code .proj-more { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; min-width: 0; }
.tl-d-code .proj-more a { font-size: 11.5px; overflow-wrap: anywhere; }
.tl-repo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 18px; font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--mute); }
.tl-repo .proj-more { margin: 0; }
.tl-detail code { font-family: var(--mono); color: var(--accent); font-size: 0.9em; }
@media (prefers-reduced-motion: reduce) { .tl-detail { animation: none; } .tl-card.has-detail { transition: none; } }
@media (max-width: 960px) { .tl-d-cols { grid-template-columns: 1fr; } }
.tl-principles { border-top: 2px solid var(--ink); padding-top: 16px; margin: 0 0 18px; }
.tl-principles .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); }
.tl-principles ol { margin: 8px 0 0; padding-left: 20px; }
.tl-principles li { font-size: 15px; line-height: 1.6; color: #2a2a2a; margin-bottom: 4px; }
@media (max-width: 700px) {
  .tl-where-key { margin-left: 0; }
  .tl-month { grid-template-columns: 1fr; gap: 10px; padding-left: 24px; }
  .tl-mark { margin-left: -24px; }
  .tl-cards { grid-template-columns: 1fr; }
  .tl-d-title { display: none; } /* 1열에서는 상세가 카드 바로 밑이라 제목이 겹침 */
}

.case-qa-grid { display: flex; flex-direction: column; }
.case-qa { padding: 20px 0; border-top: 1px solid var(--rule); }
.case-qa:last-child { border-bottom: 1px solid var(--rule); }
.case-qa .q { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; }
.case-qa .q .qm { color: var(--accent); font-family: var(--mono); font-size: 13px; }
.case-qa .a { font-size: 14px; line-height: 1.62; color: #2a2a2a; margin: 0; padding-left: 23px; }
.case-qa .a code { font-family: var(--mono); color: var(--accent); font-size: 0.9em; }
.case-qa .a strong { font-weight: 600; color: var(--ink); }

/* ============ SKILLS ============ */
.skills { background: var(--bg-alt); border-top: 1px solid var(--rule); }
.skills-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0; border-top: 1px solid var(--ink); }
.skill-group {
  grid-column: span 6;
  padding: clamp(18px, 3vh, 32px) 28px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  background: transparent;
  transition: background .3s ease;
}
.skill-group:nth-child(even) { border-right: none; }
.skill-group:hover { background: var(--paper); }
.skill-group .gh {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 18px;
}
.skill-group .gh h4 {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink); margin: 0; font-weight: 500;
}
.skill-group .gh .cnt { font-family: var(--mono); font-size: 11px; color: var(--mute); }
.skill-group .tags { display: flex; flex-wrap: wrap; gap: 8px; }

.skill-group.ai {
  grid-column: 1 / -1;
  background: var(--ink); color: var(--bg);
  border-right: none;
  position: relative; overflow: hidden;
}
.skill-group.ai::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 80% 20%, rgba(217,79,31,0.25), transparent 60%);
  pointer-events: none;
}
.skill-group.ai .gh { padding-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.12); position: relative; }
.skill-group.ai .gh h4 { color: var(--accent); }
.skill-group.ai .gh .cnt { color: rgba(255,255,255,0.5); }
.skill-group.ai .gh .star-row { display: flex; gap: 4px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 8px; letter-spacing: 0.12em; }
.skill-group.ai .ai-h {
  position: relative; font-size: clamp(22px, 2.4vw, 32px); font-weight: 500;
  letter-spacing: -0.025em; margin: 18px 0 22px; line-height: 1.2;
}
.skill-group.ai .ai-h em { color: var(--accent); font-style: italic; font-weight: 400; }
.skill-group.ai .tags { position: relative; }
.skill-group.ai .tag {
  background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.18); color: #f3ede9;
  padding: 6px 14px; font-size: 12px;
}
.skill-group.ai .tag:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* 숙련도: 3단계 점 + 근거 한 줄. % 막대 없음 */
.sk-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; margin: 0 0 18px; font-size: 12.5px; color: var(--mute); }
.sk-legend-item { display: flex; align-items: center; gap: 8px; }
.sk-legend-item b { color: var(--ink); font-weight: 600; }
.sk-draft { margin-left: auto; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 10px; }
.sk-dots { display: inline-flex; gap: 4px; align-items: center; height: 20px; }
.sk-dots i { display: block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid #8a8a8a; }
.sk-dots i.on { background: var(--accent); border-color: var(--accent); }
.sk-list { list-style: none; margin: 0; padding: 0; position: relative; }
.sk-row { display: grid; grid-template-columns: minmax(140px, 32%) 34px 1fr; gap: 12px; align-items: start; padding: 7px 0; border-top: 1px dashed var(--rule); }
.sk-row:first-child { border-top: none; padding-top: 0; }
.sk-name { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--ink); }
.sk-why { font-size: 12.5px; line-height: 20px; color: #4a4a4a; }
.sk-why b { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink); }
.skill-group.ai .sk-row { border-top-color: rgba(255,255,255,0.12); }
.skill-group.ai .sk-row:first-child { padding-top: 0; }
.skill-group.ai .sk-name { color: #f3ede9; }
.skill-group.ai .sk-why { color: rgba(243,237,233,0.72); }
.skill-group.ai .sk-why b { color: var(--accent); }
.skill-group.ai .sk-dots i { border-color: rgba(255,255,255,0.45); }
.skill-group.ai .sk-dots i.on { border-color: var(--accent); }
@media (max-width: 600px) {
  .sk-row { grid-template-columns: 1fr auto; gap: 2px 12px; }
  .sk-why { grid-column: 1 / -1; }
  .sk-draft { margin-left: 0; }
}

/* ============ EDUCATION ============ */
.education { background: var(--bg); }
.edu-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; align-items: start; }
.edu-school {
  grid-column: span 7;
  padding: 32px 0;
  border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule);
}
.edu-school .period {
  font-family: var(--mono); font-size: 13px; color: var(--mute); margin-bottom: 12px;
}
.edu-school .period b { color: var(--accent); }
.edu-school h3 {
  font-size: clamp(26px, 3vw, 38px); font-weight: 500;
  letter-spacing: -0.025em; margin: 0 0 8px; line-height: 1.15;
}
.edu-school .dept { font-family: var(--mono); font-size: 13px; color: var(--ink); }
.edu-school .deg { color: var(--mute); margin-left: 6px; }

.edu-certs { grid-column: 9 / -1; }
.edu-certs .label {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--mute); margin-bottom: 16px;
}
.edu-certs .list { display: flex; flex-wrap: wrap; gap: 8px; }
.edu-certs .tag { padding: 6px 12px; font-size: 12px; background: var(--paper); }

/* ============ CONTACT ============ */
.contact { background: var(--ink); color: var(--bg); padding: clamp(32px, 6vh, 64px) var(--pad-x) clamp(36px, 7.5vh, 80px); }
.contact .section-header { border-bottom-color: rgba(237,237,234,0.25); color: rgba(237,237,234,0.6); }
.contact .section-header .left { color: var(--bg); }
.contact .section-header .right b { color: var(--bg); }
.contact-prompt {
  font-family: var(--mono); font-size: 14px; color: var(--accent);
  margin-bottom: 32px; letter-spacing: 0.04em;
}
.contact-prompt::before { content: '> '; }

.contact-email-wrap {
  position: relative; display: block; padding: clamp(18px, 3vh, 32px) 0;
  border-top: 1px solid rgba(237,237,234,0.18);
  border-bottom: 1px solid rgba(237,237,234,0.18);
  text-decoration: none; cursor: pointer; transition: all .3s ease;
  user-select: none;
}
.contact-email-wrap:hover { border-top-color: var(--accent); border-bottom-color: var(--accent); }
.contact-email {
  font-size: clamp(36px, 7vw, 100px); font-weight: 500;
  letter-spacing: -0.045em; line-height: 1; color: var(--bg);
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
}
.contact-email .arr {
  display: inline-flex; align-items: center; justify-content: center;
  width: 0.9em; height: 0.9em; border-radius: 50%;
  border: 1px solid var(--bg); font-size: 0.4em; flex-shrink: 0;
  transition: all .3s ease;
}
.contact-email-wrap:hover .arr { background: var(--accent); border-color: var(--accent); transform: rotate(-45deg); }
.contact-copy-tip {
  position: absolute; top: 16px; right: 0;
  font-family: var(--mono); font-size: 11px; color: var(--mute);
  letter-spacing: 0.04em; opacity: 0.7;
}
.contact-copy-tip.ok { color: var(--accent); opacity: 1; }

.contact-links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: clamp(20px, 3.4vh, 36px); }
.contact-link {
  display: flex; flex-direction: column; gap: 5px;
  padding: 16px 20px; min-width: 220px;
  border: 1px solid rgba(237,237,234,0.18);
  font-family: var(--mono); transition: all .25s ease;
}
.contact-link:hover { border-color: var(--accent); background: rgba(217,79,31,0.07); }
.contact-link .k { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(237,237,234,0.5); }
.contact-link .v { font-size: 14px; color: var(--bg); display: flex; align-items: center; gap: 8px; }
.contact-link .v .arr { color: var(--accent); }

.contact-meta {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px;
  margin-top: clamp(24px, 4.5vh, 48px); padding-top: clamp(14px, 2.3vh, 24px);
  border-top: 1px solid rgba(237,237,234,0.12);
  font-family: var(--mono); font-size: 12px; color: rgba(237,237,234,0.5);
}
.contact-meta > div { display: flex; flex-direction: column; gap: 6px; }
.contact-meta > div:nth-child(1) { grid-column: span 3; }
.contact-meta > div:nth-child(2) { grid-column: span 3; }
.contact-meta > div:nth-child(3) { grid-column: span 3; }
.contact-meta > div:nth-child(4) { grid-column: span 3; text-align: right; }
.contact-meta b { color: var(--bg); font-weight: 500; }

.footer {
  padding: 32px var(--pad-x); background: var(--ink); color: rgba(237,237,234,0.5);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid rgba(237,237,234,0.08);
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1024px) {
  .nav-links { display: none; }
  .hero-num { display: none; }
  .hero-headline-wrap { grid-column: span 12; }
  .hero-mid > * { grid-column: span 12 !important; justify-content: flex-start !important; }
  .hero-bottom > * { grid-column: span 12 !important; }
  .exp-company-meta, .exp-company-desc { grid-column: span 12; }
  .proj-grid { grid-template-columns: 1fr; }
  .skill-group { grid-column: span 12; border-right: none; }
  .edu-school, .edu-certs { grid-column: span 12; }
  .about-prose, .about-terminal { grid-column: span 12; }
  .about-stats { grid-template-columns: repeat(2, 1fr); }
  .about-stat:nth-child(2) { border-right: none; }
  .about-stat:nth-child(1), .about-stat:nth-child(2) { border-bottom: 1px solid var(--rule); }
  .contact-meta > div { grid-column: span 6 !important; text-align: left !important; }
  .minor-list { grid-template-columns: 1fr; }
  .case-beat { grid-template-columns: 1fr; gap: 6px; }
  .case-beat .bn { padding-top: 0; }
}
@media (max-width: 600px) {
  .nav-time { display: none; }
  .nav-cta { padding: 7px 12px; font-size: 11px; }
  .hero-top > div { grid-column: span 12 !important; text-align: left !important; }
  .starred { grid-template-columns: 1fr; }
  .starred .star { border-right: none; border-bottom: 1px solid var(--rule); padding: 16px 0; }
  .about-stats { grid-template-columns: 1fr; }
  .about-stat { border-right: none !important; border-bottom: 1px solid var(--rule); }
  .contact-email > span { overflow-wrap: anywhere; min-width: 0; }
  .pager { gap: 10px; }
  .pager-info { display: none; }
  .pager-tick { font-size: 9px; padding: 8px 4px; min-width: 24px; }
  .pager-tick.on::after { left: 4px; right: 4px; }
  .pager-btn { padding: 8px 12px; font-size: 0; }
  .pager-btn .arr { font-size: 14px; }
  .footer { flex-direction: column; gap: 6px; text-align: center; }
}
/* 10개 tick + Prev/Next 버튼이 390px 폭에서 맞닿아 간격을 좁히는 구간을 440px까지 넓힘 */
@media (max-width: 440px) {
  .pager-ticks { gap: 2px; }
  .pager-tick { min-width: 20px; padding: 8px 2px; }
}
/* 낮은 화면: 디스플레이 타이포를 줄여 fit 축소(zoom) 부담을 낮춘다 */
@media (max-height: 820px) {
  .about-headline h2 { font-size: clamp(36px, 5.5vw, 84px); }
  .about-prose p { font-size: 15px; }
  .about-prose p:first-child { font-size: 16.5px; }
  .terminal { font-size: 12px; }
  .terminal-body { min-height: 268px; }
  .about-stat .n { font-size: clamp(30px, 3.6vw, 48px); }
  .skill-group .gh { margin-bottom: 12px; }
  .skill-group.ai .ai-h { font-size: clamp(19px, 2vw, 26px); margin: 14px 0 16px; }
  .skill-group.ai .tag { padding: 4px 10px; font-size: 11px; }
}
@media (max-height: 480px) {
  :root { --nav-h: 44px; --pager-h: 44px; }
  .pager-info { display: none; }
}

/* ===== 2026-11-23 pf-front ===== */
/* 제작 방식 고지 (Contact 맨 아래) */
.fx-colophon { font-family: var(--mono); font-size: 11px; line-height: 1.75; color: rgba(237,237,234,0.55); margin: 28px 0 0; max-width: 720px; }
.fx-colophon span { display: block; letter-spacing: 0.14em; color: rgba(237,237,234,0.4); margin-bottom: 6px; }
/* 공통: 키보드 포커스 표시 */
.hero-num a:focus-visible, .hero-ctas a:focus-visible, .hero-slogan .case-hint:focus-visible,
.exp-company-desc .fx-xref:focus-visible, .fx-lv:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* --- Hero: 목차 훅 3줄 · 바로가기 2줄 · CTA 위계 --- */
.hero-num a.fx-hooked { color: var(--ink-2); }
.hero-slogan .fx-hints { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 12px; }
.hero .hero-bottom { margin-top: 22px; } /* 바로가기 한 줄이 늘어난 만큼 줄여 데스크톱에서 축소(zoom) 없이 한 화면에 맞춤 */
.hero-slogan .fx-hints .case-hint { margin-top: 0; }
.hero-ctas.fx-ctas { align-items: center; }
.fx-cta-text {
  margin-left: 10px; padding: 6px 2px 4px; font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
  color: var(--ink); border-bottom: 1px solid var(--rule-strong); transition: color .2s ease, border-color .2s ease;
}
.fx-cta-text:hover { color: var(--accent); border-color: var(--accent); }
@media (max-width: 600px) {
  .hero-top { gap: 5px 24px; padding-bottom: 16px; }
  .hero-ctas.fx-ctas { gap: 10px; }
  .hero-ctas.fx-ctas .btn { padding: 15px 18px; }
  .fx-cta-text { margin-left: 4px; }
}

/* --- About: 넷째 문단(현재 일)을 오른쪽 열 맨 위에. JSX의 FX_LAYOUT.aboutNowAside가 켜져 있을 때만 쓰임 --- */
.fx-about-side { grid-column: span 5; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.fx-about-side .about-prose, .fx-about-side .about-terminal { grid-column: auto; }
.fx-now { border-top: 1px solid var(--ink); padding-top: 14px; }
.fx-now-label {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--mute);
}
.fx-now-label b { color: var(--ink); font-weight: 500; }
.fx-now-label .promo { padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10px; letter-spacing: 0.05em; }
.about-prose.fx-now p, .about-prose.fx-now p:first-child { font-size: 17px; color: #111; margin-bottom: 0; }
@media (max-width: 1024px) {
  .fx-about-side { grid-column: span 12; }
  .about-prose.fx-now { margin-top: -6px; }
}
@media (max-height: 820px) { .about-prose.fx-now p, .about-prose.fx-now p:first-child { font-size: 15px; } }

/* --- Experience: 본문 안의 섹션 바로가기 --- */
.exp-company-desc .fx-xref { border-bottom: 1px solid var(--accent); padding-bottom: 1px; transition: color .2s ease; }
.exp-company-desc .fx-xref:hover { color: var(--accent); }

/* --- Projects: 카드 바로가기 목록 · 블록 라벨 대비 --- */
.fx-idx { list-style: none; margin: calc(-1 * clamp(12px, 3vh, 34px)) 0 clamp(22px, 4.4vh, 40px); padding: 0; }
.fx-idx li { border-bottom: 1px solid var(--rule); }
.fx-idx button {
  display: grid; grid-template-columns: 34px minmax(0, 260px) minmax(0, 1fr) auto 18px; gap: 2px 20px; align-items: baseline;
  width: 100%; padding: 11px 6px; background: none; border: 0; text-align: left; color: var(--ink); font: inherit;
  transition: background .2s ease;
}
.fx-idx button:hover { background: var(--paper); }
.fx-idx button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.fx-idx .n { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent); }
.fx-idx .biz { font-size: 14px; color: var(--mute); letter-spacing: -0.01em; }
.fx-idx .claim { font-size: 15px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.4; }
.fx-idx .cat { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.fx-idx .go { font-family: var(--mono); font-size: 12px; color: var(--mute); text-align: right; transition: transform .2s ease, color .2s ease; }
.fx-idx button:hover .go { color: var(--accent); transform: translateY(2px); }
@media (max-width: 860px) {
  .fx-idx button { grid-template-columns: 26px minmax(0, 1fr) 16px; gap: 2px 10px; padding: 10px 2px; }
  .fx-idx .n { grid-row: 1 / span 3; }
  .fx-idx .cat { grid-column: 2; grid-row: 1; white-space: normal; font-size: 9.5px; }
  .fx-idx .biz { grid-column: 2; grid-row: 2; font-size: 13px; }
  .fx-idx .claim { grid-column: 2; grid-row: 3; font-size: 14.5px; }
  .fx-idx .go { grid-column: 3; grid-row: 1 / span 3; align-self: center; }
}
.proj-card:focus { outline: none; border-color: var(--ink); }
.proj-card:focus::before { transform: scaleX(1); }
.proj-card .proj-block .blabel { color: var(--ink-2); font-weight: 500; }
.proj-card .proj-block.fx-result .blabel { color: var(--accent); }

/* --- Case Study: 붙박이 목차(현재 위치) · 줄 폭. 06 · 07이 case-* 골격을 같이 쓰므로 #case-study로 한정 --- */
.fx-toc {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 4px;
  margin: 0 0 40px; padding: 8px 0; overflow-x: auto; scrollbar-width: none;
  background: rgba(227,227,223,0.94); backdrop-filter: saturate(140%) blur(10px);
  border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.04em;
}
.fx-toc::-webkit-scrollbar { display: none; }
.fx-toc button {
  position: relative; flex: none; white-space: nowrap; background: none; border: 0; border-radius: 999px;
  padding: 8px 12px; font: inherit; letter-spacing: inherit; color: var(--mute); transition: color .2s ease, background .2s ease;
}
.fx-toc button:hover { color: var(--ink); }
.fx-toc button[aria-current="true"] { color: var(--ink); background: rgba(17,17,17,0.06); }
.fx-toc button[aria-current="true"]::before { content: ''; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 1px; background: var(--accent); }
.fx-toc button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.fx-toc b { font-weight: 500; color: var(--accent); margin-right: 6px; }
#case-study .case-intro { margin-bottom: 36px; }
#case-study .case-section-label:focus { outline: none; }
#case-study .case-lead { max-width: 1000px; }
@media (min-width: 1100px) {
  #case-study .case-beat .bbody { display: grid; grid-template-columns: 270px minmax(0, 860px); column-gap: 40px; }
  #case-study .case-beat .bbody h4 { grid-column: 1; grid-row: 1 / span 6; margin: 0; line-height: 1.45; }
  #case-study .case-beat .bbody p { grid-column: 2; }
  #case-study .case-qa-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 56px; }
  #case-study .case-qa:nth-last-child(2) { border-bottom: 1px solid var(--rule); }
}
@media (max-width: 600px) {
  .fx-toc { font-size: 10.5px; margin-bottom: 30px; }
  .fx-toc button { padding: 8px 9px; }
  .fx-toc button[aria-current="true"]::before { left: 9px; right: 9px; }
}

/* --- Skills: 범례 = 숙련도 필터 · AI Engineering 묶음을 맨 위에(FX_LAYOUT.skillsAiFirst) --- */
.sk-legend .fx-lv {
  background: none; border: 1px solid transparent; border-radius: 999px; padding: 3px 12px 3px 10px; margin: -4px 0 -4px -11px;
  font: inherit; color: inherit; text-align: left; transition: border-color .2s ease, background .2s ease;
}
.sk-legend .fx-lv:hover { border-color: var(--rule-strong); }
.sk-legend .fx-lv[aria-pressed="true"] { border-color: var(--accent); background: var(--paper); }
.fx-lv-hint { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; color: var(--mute); margin-left: auto; }
.skills[data-fx-lv] .sk-row { transition: opacity .2s ease; }
.skills[data-fx-lv="1"] .sk-row:not([data-lv="1"]),
.skills[data-fx-lv="2"] .sk-row:not([data-lv="2"]),
.skills[data-fx-lv="3"] .sk-row:not([data-lv="3"]) { opacity: 0.26; }
@media (min-width: 1025px) {
  .skills-grid.fx-ai-first .skill-group:nth-child(even) { border-right: 1px solid var(--rule); }
  .skills-grid.fx-ai-first .skill-group:nth-child(odd) { border-right: none; }
}
@media (max-width: 600px) {
  .sk-legend .fx-lv { align-items: flex-start; border-radius: 10px; }
  .fx-lv-hint { margin-left: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .fx-idx button, .fx-idx .go, .fx-toc button, .fx-cta-text, .sk-legend .fx-lv,
  .skills[data-fx-lv] .sk-row, .exp-company-desc .fx-xref { transition: none; }
}
/* ===== /pf-front ===== */

/* ===== 2026-11-23 pf-06 ===== */
/* 06 AI Harness: 머리말(lead + 원칙 · 공개 레포) → 먼저 볼 3장 → 전체 기록(필터 · 달 바로가기 · 목록 보기) */

/* 머리말: lead 줄 길이를 줄이고 원칙 5줄을 옆에 둠 */
#ai-harness .tl-intro { margin-bottom: 36px; }
.t6-lead-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 20px 56px; align-items: start; }
.t6-lead-row .case-lead { margin: 0; }
.t6-principles { border-top: 0; border-left: 2px solid var(--ink); padding: 2px 0 2px 22px; margin: 0; }
.t6-principles ol { list-style: none; margin: 10px 0 0; padding: 0; counter-reset: t6p; }
.t6-principles li { counter-increment: t6p; display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: baseline; font-size: 15.5px; font-weight: 500; line-height: 1.5; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 5px; word-break: keep-all; }
.t6-principles li:last-child { margin-bottom: 0; }
.t6-principles li::before { content: counter(t6p, decimal-leading-zero); font-family: var(--mono); font-size: 10.5px; font-weight: 400; letter-spacing: 0; color: var(--accent); }
#ai-harness .tl-intro .case-meta { margin-top: 26px; padding-top: 18px; }
.t6-repo { flex: 1 1 380px; min-width: 0; }
.t6-repo .v { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.t6-repo .proj-more { margin: 0; flex: none; }
.t6-repo .proj-more a { font-size: 13px; font-weight: 500; border-bottom-color: var(--accent); }
.t6-repo-desc { flex: 1 1 300px; min-width: 0; font-size: 11.5px; line-height: 1.55; color: var(--mute); }

/* 먼저 볼 3장 */
.t6-feat { margin: 0 0 44px; }
.t6-feat-title, .t6-rec-title { margin: 0; font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); }
.t6-feat-title { margin-bottom: 12px; }
.t6-feat-title::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--accent); margin-right: 9px; }
.t6-feat-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 14px; position: relative; }
.t6-fcard { position: relative; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(0,0,0,0.28); border-top: 2px solid var(--ink); border-radius: 8px; padding: 14px 18px 13px; background: var(--paper); transition: border-color .15s; }
.t6-fcard:hover { border-color: rgba(0,0,0,0.5); border-top-color: var(--ink); }
.t6-fcard[data-open] { border-color: var(--accent); }
.t6-fcard-top { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--mute); }
.t6-fno { font-size: 11px; font-weight: 600; color: var(--accent); }
.t6-fcard-top .tl-layer { margin-left: auto; }
.t6-fcard h5 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.32; color: var(--ink); word-break: keep-all; }
.t6-fwhat { margin: 0; font-size: 14px; line-height: 1.55; color: #2a2a2a; word-break: keep-all; }
.t6-fcard .tl-where { padding-top: 8px; }
.t6-fcard .tl-toggle:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.t6-fcard:hover .tl-more, .t6-fcard[data-open] .tl-more { color: var(--accent); }
.t6-d-foot { display: flex; justify-content: flex-end; margin-top: 12px; }
.t6-jump { font: inherit; font-family: var(--mono); font-size: 11px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--rule-strong); padding: 0 0 2px; cursor: pointer; }
.t6-jump:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* 전체 기록: 제목 줄 · 필터 칩 */
.t6-rec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; border-top: 2px solid var(--ink); padding-top: 14px; margin-bottom: 14px; }
.t6-rec-title span { font-weight: 400; color: var(--mute); }
.t6-rec-hint { margin: 0; font-family: var(--mono); font-size: 11px; color: var(--mute); }
.t6-rec-tools { display: flex; align-items: center; gap: 10px; margin-left: auto; font-family: var(--mono); font-size: 11px; }
.t6-seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; }
.t6-seg button { font: inherit; color: var(--mute); background: none; border: 0; padding: 4px 12px; cursor: pointer; }
.t6-seg button:hover { color: var(--ink); }
.t6-seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.t6-filters { display: grid; gap: 8px; margin-bottom: 14px; }
.t6-fgroup { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: start; }
.t6-fk { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; color: var(--mute); padding-top: 9px; }
.t6-chips { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.t6-chips-layer { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* 목록 보기: 한 줄에 이름 · 분류 · what · 적용처. 적용 줄은 펼치면 보임 */

/* ===== /2026-11-23 pf-06 ===== */
/* ===== 2026-11-23 pf-07 ===== */
/* 07 AI Projects: 프로젝트 탭 · 붙는 바 · 머리(Stage | Role 띠, 블록 목차, lead | meta) · 블록 · beat 접기 · 11단계 그림 조작 줄 */
.p7 { overflow-anchor: none; }
.p7 button { font-family: inherit; }
.p7 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.p7 .p7-intro { margin: 0 0 24px; font-size: 16px; line-height: 1.62; }
/* 제목 · 라벨류는 낱말 중간에서 줄이 끊기지 않게 */
.p7-tab-n, .p7-tab-s, .p7-st .v, .p7-steps, .p7-toc-i, .p7-bt, .p7-btl, .p7-next .n { word-break: keep-all; overflow-wrap: anywhere; }

/* 프로젝트 탭: 번호 · 구분 / 이름 / Stage 한 줄 */
.p7-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); margin-bottom: 36px; }
.p7-tab { appearance: none; background: none; border: 0; border-left: 1px solid var(--rule); border-radius: 0; margin: 0; padding: 15px 20px 16px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; color: var(--ink-2); transition: background .15s ease; }
.p7-tab:first-child { border-left: 0; }
.p7-tab:hover { background: rgba(246,245,242,0.6); }
.p7-tab.on { background: var(--paper); color: var(--ink); }
.p7-tab.on::before { content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 3px; background: var(--accent); }
.p7-tab-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); display: flex; gap: 9px; }
.p7-tab-k b { color: var(--accent); font-weight: 500; }
.p7-tab-n { font-size: 19px; font-weight: 600; letter-spacing: -0.022em; line-height: 1.3; }
.p7-tab-s { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--mute); }
.p7-tab.on .p7-tab-s { color: var(--ink-2); }

/* 붙는 바: 탭이 화면 위로 지나가면 나타남. 자리를 차지하지 않게 높이 0 + 안쪽 절대 배치 */
.p7-stick { position: sticky; top: 0; height: 0; z-index: 20; }
.p7-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px; min-height: 46px; background: var(--bg-alt); border-bottom: 1px solid var(--rule-strong); font-family: var(--mono); font-size: 11.5px; visibility: hidden; opacity: 0; transition: opacity .18s ease, visibility 0s linear .18s; }
.p7-bar.on { visibility: visible; opacity: 1; transition: opacity .18s ease, visibility 0s; }
.p7-bar-proj, .p7-bar-blocks { display: flex; align-items: center; gap: 2px; min-width: 0; }
.p7-bar-proj { flex: none; padding-right: 14px; border-right: 1px solid var(--rule); }
.p7-bar-blocks { flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.p7-bar-blocks::-webkit-scrollbar { display: none; }
.p7-bar button { appearance: none; background: none; border: 0; margin: 0; padding: 7px 11px; border-radius: 999px; font-size: inherit; color: var(--mute); white-space: nowrap; display: inline-flex; align-items: baseline; gap: 7px; }
.p7-bar button b { font-weight: 500; color: var(--accent); }
.p7-bar button:hover { color: var(--ink); }
.p7-bar button.on { color: var(--ink); background: rgba(17,17,17,0.07); }
.p7-bar button:focus-visible { outline-offset: -2px; }

/* 프로젝트 머리 */
.p7-panel { animation: p7In .26s ease both; }
@keyframes p7In { from { opacity: 0; } to { opacity: 1; } }
.p7-h { font-size: clamp(28px, 4vw, 52px); font-weight: 500; letter-spacing: -0.035em; line-height: 1.08; margin: 14px 0 24px; outline: none; }
.p7-status { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 0 56px; border-top: 1px solid var(--rule-strong); }
.p7-st { display: flex; flex-direction: column; gap: 9px; padding: 17px 0 19px; min-width: 0; }
.p7-st .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.p7-st .v, .p7-steps { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.5; color: var(--ink); }
.p7-st.role .v { font-size: 16px; }
.p7-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; }
.p7-steps li { display: inline-flex; align-items: baseline; }
.p7-steps li + li::before { content: '→'; color: var(--accent); font-weight: 400; margin: 0 11px; }

/* 블록 목차: 번호 / 주제 / 부제. 누르면 그 블록으로 */
.p7-toc { display: grid; grid-template-columns: repeat(var(--p7-n, 4), minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.p7-toc-i { appearance: none; background: none; border: 0; border-left: 1px solid var(--rule); border-radius: 0; margin: 0; padding: 13px 18px 15px; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 11px; align-content: start; color: var(--ink); transition: background .15s ease; }
.p7-toc-i:first-child { border-left: 0; padding-left: 0; }
.p7-toc-i:hover { background: rgba(246,245,242,0.6); }
.p7-toc-i .n { grid-row: 1 / span 2; font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 500; padding-top: 3px; }
.p7-toc-i .t { font-size: 15px; font-weight: 600; letter-spacing: -0.012em; line-height: 1.4; }
.p7-toc-i .t i { font-style: normal; font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--mute); margin-left: 8px; }
.p7-toc-i:hover .t i { color: var(--accent); }
.p7-toc-i .s { grid-column: 2; font-size: 13px; line-height: 1.45; color: var(--ink-2); }

.p7-body { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 0 56px; padding-top: 26px; }
.p7 .p7-lead { margin: 0; font-size: 16px; line-height: 1.72; }

.p7-facts dt { color: var(--mute); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; padding-top: 3px; }
.p7-facts dd { margin: 0; color: var(--ink); line-height: 1.62; }

/* 블록 머리 */
.p7-block { margin-top: 68px; }
.p7-bh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; border-bottom: 1px solid var(--rule-strong); margin-bottom: 26px; }
.p7-bt { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 23px; font-weight: 600; letter-spacing: -0.022em; line-height: 1.32; color: var(--ink); }
.p7-bt .n { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--accent); }
.p7-bt .s { font-weight: 400; color: var(--mute); }
.p7-view { flex: none; display: inline-flex; padding: 2px; border: 1px solid var(--rule-strong); border-radius: 999px; font-family: var(--mono); font-size: 11px; }
.p7-view button { appearance: none; background: none; border: 0; margin: 0; padding: 5px 12px; border-radius: 999px; font-size: inherit; color: var(--mute); white-space: nowrap; }
.p7-view button:hover { color: var(--ink); }
.p7-view button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.p7 .hx-fig { margin-bottom: 14px; }
.p7 .case-fig { max-width: 1040px; font-size: 12px; line-height: 1.65; }
.p7 .hx-fig + .case-fig { margin-bottom: 30px; }
.p7 .harness-axes { margin-bottom: 0; }

/* beat: 번호 | 제목 | 본문 3단. 제목 열만 훑어도 흐름이 읽힘 */
.p7-beats { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.p7-bh + .p7-beats { border-top: 0; }
.p7-beat { display: grid; grid-template-columns: 34px minmax(0, 330px) minmax(0, 1fr); gap: 0 28px; align-items: start; padding: 17px 0 18px; border-bottom: 1px solid var(--rule); }
.p7-bh + .p7-beats .p7-beat:first-child { padding-top: 0; }
.p7-bn { font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 500; padding-top: 3px; }
.p7-btl { margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -0.014em; line-height: 1.45; }
.p7-btl button { appearance: none; background: none; border: 0; margin: 0; padding: 0; width: 100%; font-size: inherit; font-weight: inherit; letter-spacing: inherit; line-height: inherit; color: var(--ink); text-align: left; display: flex; align-items: baseline; justify-content: flex-start; gap: 10px; }
.p7-btl .ic { flex: none; font-family: var(--mono); font-weight: 400; font-size: 14px; color: var(--mute); }

.p7-bx { min-width: 0; }
.p7-bbody[hidden] { display: none; }
.p7-bbody p { margin: 0; max-width: 820px; font-size: 14.5px; line-height: 1.68; color: var(--ink-2); }
.p7-bbody p + p { margin-top: 8px; }
.p7-bbody code { font-family: var(--mono); color: var(--accent); font-size: 0.9em; }
.p7-keys { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 1px; }
.p7-keys span { padding: 3px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--paper); font-size: 12.5px; font-weight: 600; line-height: 1.45; color: var(--ink); }
.p7-first { margin: 0; padding-top: 2px; max-width: 820px; font-size: 13.5px; line-height: 1.6; color: var(--mute); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }

.p7-next button:hover .n { color: var(--accent); }
.p7 .p7-note { margin: 44px 0 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--accent); max-width: 1040px; font-size: 12px; line-height: 1.7; color: var(--ink-2); }

/* 11단계 그림: 단계 강조 + 조작 줄 */
.p7-step { cursor: pointer; transition: opacity .15s ease; }
.p7-flow { max-width: 1104px; margin: 16px auto 0; padding-top: 14px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 32px; align-items: start; min-height: 68px; }

.p7-flow-ticks button:hover, .p7-flow-ticks button.on { color: var(--ink); background: var(--accent-soft); }
